dependencies:
  idf: ^6.0
  espressif/ethernet_init:
    version: "~1.3.0"
  # The bridge always operates Wi-Fi through a coprocessor (see
  # README — onboard C6 over SDIO), regardless of the host chip the
  # bridge happens to run on.
  espressif/esp_wifi_remote: ">=1.6.4,<2.0"
  espressif/esp_hosted: "==3.0.9"   # the coprocessor in coprocessor/ uses the same version
  scrambletools/esp_ptp: ">=1.10.0"
  scrambletools/esp_hosted_avb: ">=0.6.0"
  scrambletools/esp_avb: "*"
